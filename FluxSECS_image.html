<script>
        const colors = {
            fluxStart: '#007ACC',
            fluxEnd: '#0099ff',
            secsDeep: ['#1e3a8a', '#0f172a', '#000000'],
            cyan: '#06b6d4',
            neonCyan: '#22d3ee'
        };

        // === 主商標名稱（可由 UI 動態修改） ===
        // 預設：Flux + SECS（與原版一致）
        let brandLeft = "Flux";
        let brandRight = "SECS";

        function getBrandName() {
            return `${brandLeft}${brandRight}`;
        }

        // Icon 兩個字母（預設取主商標左右字的首字）
        function getIconLeftLetter() {
            return (brandLeft && brandLeft.length > 0) ? brandLeft[0].toUpperCase() : "F";
        }
        function getIconRightLetter() {
            return (brandRight && brandRight.length > 0) ? brandRight[0].toUpperCase() : "S";
        }

        function syncBrandToHeader() {
            const name = getBrandName();
            const h = document.getElementById("brandNameHeader");
            const s = document.getElementById("brandNameSub");
            if (h) h.textContent = name;
            if (s) s.textContent = name;
            // 同步 browser tab title
            document.title = `${name} 圖檔生成器`;
        }

        function applyBrandFromInputs(reset = false) {
            const leftEl = document.getElementById("brandLeftInput");
            const rightEl = document.getElementById("brandRightInput");
            if (!leftEl || !rightEl) return;

            if (reset) {
                leftEl.value = "Flux";
                rightEl.value = "SECS";
            }

            const left = (leftEl.value || "").trim();
            const right = (rightEl.value || "").trim();

            // 允許右字可空（例如只要單字品牌）
            brandLeft = left.length > 0 ? left : "Flux";
            brandRight = right; 

            syncBrandToHeader();

            // 重新產生靜態 4 張預覽（不改布局）
            try { generateAllLogos(); } catch (e) {}

            // 若動態預覽正在跑，強制重繪一次
            try { startPreview(); } catch (e) {}
        }


        const fontSize = 220;
        const paddingX = 60; 
        const paddingY = 60; 

        document.fonts.ready.then(function() {
            setTimeout(() => {
                // 初始化主商標名稱（與輸入框同步）
                syncBrandToHeader();
                const applyBtn = document.getElementById("applyBrandBtn");
                const resetBtn = document.getElementById("resetBrandBtn");
                if (applyBtn) applyBtn.addEventListener("click", () => applyBrandFromInputs(false));
                if (resetBtn) resetBtn.addEventListener("click", () => applyBrandFromInputs(true));
                // 允許直接按 Enter 套用
                const leftEl = document.getElementById("brandLeftInput");
                const rightEl = document.getElementById("brandRightInput");
                [leftEl, rightEl].forEach(el => {
                    if (!el) return;
                    el.addEventListener("keydown", (ev) => {
                        if (ev.key === "Enter") applyBrandFromInputs(false);
                    });
                });

                generateAllLogos();
                updateGifConfig(); 
                const status = document.getElementById('status');
                status.className = "mt-4 inline-block px-4 py-2 bg-green-50 text-green-700 rounded-lg font-bold";
                status.textContent = "就緒";
            }, 800);
        });

        // 1. 靜態圖生成
        function generateAllLogos() {
            drawLogoSolar('c1');
            drawLogoAurora('c2');
            drawIconLight('c3');
            drawIconDark('c4');
        }

        // A. 主商標 (Banner) - 極限貼邊
        // textOnly=true：保留原本輸出尺寸與文字位置，但不繪製卡片背景/星點/邊框，輸出透明背景（僅剩字體與效果）
        function renderLogoFrame(canvas, theme, intensity = 0, bgColor = null, textOnly = false, overrideLeft = null, overrideRight = null) {
            const ctx = canvas.getContext('2d');

            
            // 動態覆寫用：若提供 overrideLeft / overrideRight，則以覆寫文字繪製；否則使用 UI 可編輯的 brandLeft / brandRight。
            const leftText = (overrideLeft !== null && overrideLeft !== undefined) ? overrideLeft : brandLeft;
            const rightText = (overrideRight !== null && overrideRight !== undefined) ? overrideRight : brandRight;

            ctx.font = `bold ${fontSize}px 'Chakra Petch'`;
            const wFlux = ctx.measureText(leftText).width;
            const wSecs = ctx.measureText(rightText).width;
            const gap = 0;
            const totalTextW = wFlux + gap + wSecs;

            // 內容尺寸
            const contentW = totalTextW + (paddingX * 2);
            const contentH = (fontSize * 0.8) + (paddingY * 2); 

            // 線條寬度（維持與原本一致，確保尺寸不變）
            const lw = (theme === 'light' ? 4 : 2);

            // 最終畫布尺寸：內容 + 線條寬度。使用 ceil 確保整數
            const finalW = Math.ceil(contentW + lw);
            const finalH = Math.ceil(contentH + lw);

            if (canvas.width !== finalW || canvas.height !== finalH) {
                canvas.width = finalW;
                canvas.height = finalH;
            }

            // 清空（透明）
            ctx.clearRect(0, 0, finalW, finalH);
            if (bgColor) {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, finalW, finalH);
            }

            ctx.font = `bold ${fontSize}px 'Chakra Petch'`;
            ctx.textBaseline = 'middle';

            // 座標計算：線條中心點設為 lw/2，這樣線條外緣剛好貼齊畫布邊緣
            const rectX = lw / 2; 
            const rectY = lw / 2;
            const cardW = contentW;
            const cardH = contentH;

            // 文字
            const startX = rectX + paddingX;
            const textY = rectY + (cardH / 2) + 5; 

            const drawText = () => {
                const gradFlux = ctx.createLinearGradient(0, rectY, 0, rectY + cardH); 
                gradFlux.addColorStop(0, colors.fluxStart);
                gradFlux.addColorStop(1, colors.fluxEnd);
                ctx.fillStyle = gradFlux;
                ctx.textAlign = 'left';
                ctx.fillText(leftText, startX, textY);

                const secsX = startX + wFlux + gap;
                if (theme === 'light') {
                    // Solar：描邊 + 漸層填滿（保留原本視覺效果）
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = 24; 
                    const alpha = 0.4 + (0.6 * intensity);
                    ctx.strokeStyle = `rgba(6, 182, 212, ${alpha})`;
                    ctx.strokeText(rightText, secsX, textY);

                    const gradSecs = ctx.createLinearGradient(0, rectY, 0, rectY + cardH); 
                    gradSecs.addColorStop(0, colors.secsDeep[0]);
                    gradSecs.addColorStop(0.5, colors.secsDeep[1]);
                    gradSecs.addColorStop(1, colors.secsDeep[2]);
                    ctx.fillStyle = gradSecs;
                    ctx.fillText(rightText, secsX, textY);
                } else {
                    // Aurora：白字 + Neon Glow
                    const blurAmount = 10 + (40 * intensity);
                    ctx.shadowColor = colors.neonCyan;
                    ctx.shadowBlur = blurAmount;
                    ctx.fillStyle = "white";
                    ctx.fillText(rightText, secsX, textY);

                    // 第二次填字（不帶陰影）讓字形更銳利
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "white";
                    ctx.fillText(rightText, secsX, textY);
                }
            };

            if (textOnly) {
                // 透明去背（只輸出字體）
                drawText();
                return;
            }

            // 繪製卡片（原版）
            if (theme === 'light') {
                ctx.shadowBlur = 0;
                ctx.shadowColor = "transparent";
                roundRect(ctx, rectX, rectY, cardW, cardH, 32);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
            } else {
                const centerX = rectX + cardW / 2;
                const bgGrad = ctx.createRadialGradient(centerX, rectY + cardH, 0, centerX, rectY + cardH, cardW); 
                bgGrad.addColorStop(0, '#1b2735');
                bgGrad.addColorStop(1, '#090a0f');
                ctx.shadowBlur = 0;
                roundRect(ctx, rectX, rectY, cardW, cardH, 32);
                ctx.fillStyle = bgGrad;
                ctx.fill();
            }

            // Clip 內部
            ctx.save();
            roundRect(ctx, rectX, rectY, cardW, cardH, 32);
            ctx.clip();

            // 星星
            if (theme === 'dark') {
                let seed = 1; 
                const random = () => { var x = Math.sin(seed++) * 10000; return x - Math.floor(x); }
                for (let i = 0; i < 30; i++) { 
                    ctx.beginPath(); 
                    ctx.arc(rectX + random() * cardW, rectY + random() * cardH, random() * 2.5, 0, Math.PI * 2); 
                    ctx.fillStyle = `rgba(255,255,255,${random() * 0.8})`;
                    ctx.fill(); 
                }
            }

            drawText();
            ctx.restore();

            // 繪製邊框
            if (theme === 'light') {
                ctx.strokeStyle = "#e2e8f0";
                ctx.lineWidth = lw;
                ctx.stroke();
            } else {
                ctx.strokeStyle = "rgba(255,255,255,0.15)";
                ctx.lineWidth = lw;
                ctx.stroke();
            }
        }

        // B. App Icon 渲染 - 滿版 (512x512)
        // textOnly=true：保留原本 512x512 尺寸與文字位置，但不繪製卡片背景/邊框，輸出透明背景（僅剩字體與效果）
        function renderIconFrame(canvas, theme, intensity = 0, bgColor = null, textOnly = false) {
            const w = 512, h = 512;
            if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }

            const ctx = canvas.getContext('2d');
            if (bgColor) {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, w, h);
            } else {
                ctx.clearRect(0, 0, w, h);
            }
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            const lw = 8;
            const margin = lw / 2; // 4
            const x = margin;
            const y = margin;
            const cardW = (w - lw); // 504
            const cardH = (h - lw); // 504
            const r = 110; 

            if (!textOnly) {
                if (theme === 'light') {
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = "transparent";
                    roundRect(ctx, x, y, cardW, cardH, r);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill(); 
                } else {
                    const bgGrad = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
                    bgGrad.addColorStop(0, '#1b2735');
                    bgGrad.addColorStop(1, '#000000');
                    roundRect(ctx, x, y, cardW, cardH, r);
                    ctx.fillStyle = bgGrad;
                    ctx.fill(); 
                }
            }

            ctx.save();

            ctx.font = "bold 300px 'Chakra Petch'";
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            const centerY = 274; 

            const gradF = ctx.createLinearGradient(0, y, 0, y + cardH);
            gradF.addColorStop(0, colors.fluxStart);
            gradF.addColorStop(1, colors.fluxEnd);
            ctx.fillStyle = gradF; 
            ctx.fillText(getIconLeftLetter(), 168, centerY);

            if (theme === 'light') {
                ctx.lineJoin = 'round';
                ctx.lineWidth = 32; 
                const alpha = 0.4 + (0.6 * intensity);
                ctx.strokeStyle = `rgba(6, 182, 212, ${alpha})`;
                ctx.strokeText("S", 354, centerY);

                const gradS = ctx.createLinearGradient(0, y, 0, y + cardH);
                gradS.addColorStop(0, colors.secsDeep[0]);
                gradS.addColorStop(1, colors.secsDeep[2]);
                ctx.fillStyle = gradS;
                ctx.fillText(getIconRightLetter(), 354, centerY);
            } else {
                const blurAmount = 10 + (40 * intensity);
                ctx.shadowColor = colors.neonCyan;
                ctx.shadowBlur = blurAmount; 
                ctx.fillStyle = "white";
                ctx.fillText(getIconRightLetter(), 354, centerY); 

                ctx.shadowBlur = 0;
                ctx.fillStyle = "white";
                ctx.fillText(getIconRightLetter(), 354, centerY);
            }
            ctx.restore();

            // 邊框（原版）
            if (!textOnly) {
                if (theme === 'light') {
                    ctx.strokeStyle = "#e2e8f0";
                    ctx.lineWidth = lw;
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = "rgba(255,255,255,0.1)";
                    ctx.lineWidth = lw;
                    ctx.stroke();
                }
            }
        }

        // ================= 3. GIF 控制邏輯 =================
        let animId = null;
        let isGenerating = false;
        let gifConfig = { target: 'banner' }; 

        function updateGifConfig() {
            const target = document.querySelector('input[name="gifTarget"]:checked').value;
            gifConfig.target = target;
            updatePreviewTheme();
            startPreview();
        }

        function updatePreviewTheme() {
            const theme = document.querySelector('input[name="gifTheme"]:checked').value;
            const bgMode = document.querySelector('input[name="gifBg"]:checked').value;
            const container = document.getElementById('previewContainer');
            // 移除 padding，讓 Canvas 直接撐開
            const padding = 'p-0'; 

            if (bgMode === 'transparent') {
                container.className = `bg-checker ${padding} flex items-center justify-center`;
            } else {
                if (theme === 'dark') {
                    container.className = `bg-slate-900 ${padding} flex items-center justify-center transition-colors duration-500 rounded-lg`;
                } else {
                    container.className = `bg-slate-100 ${padding} flex items-center justify-center transition-colors duration-500 rounded-lg`;
                }
            }
        }

        function startPreview() {
            if (animId) cancelAnimationFrame(animId);
            const canvas = document.getElementById('previewCanvas');
            const buffer = document.createElement('canvas');

            function loop() {
                if (isGenerating) return; 
                
                const theme = document.querySelector('input[name="gifTheme"]:checked').value;
                const bgMode = document.querySelector('input[name="gifBg"]:checked').value;
                const now = Date.now();
                const t = (now % 2000) / 2000; 
                const intensity = (Math.sin(t * Math.PI * 2 - Math.PI/2) + 1) / 2; 

                let previewBg = null;
                if (bgMode === 'solid') {
                    previewBg = theme === 'light' ? '#ffffff' : '#090a0f';
                }

                if (gifConfig.target === 'banner') {
                    renderLogoFrame(buffer, theme, intensity, previewBg, false, 'Flux', 'SECS');
                } else {
                    renderIconFrame(buffer, theme, intensity, previewBg);
                }

                if (canvas.width !== buffer.width || canvas.height !== buffer.height) {
                    canvas.width = buffer.width;
                    canvas.height = buffer.height;
                }
                
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0,0,canvas.width, canvas.height);
                ctx.drawImage(buffer, 0, 0);

                animId = requestAnimationFrame(loop);
            }
            loop();
        }

        async function generateAndDownloadGIF() {
            if (isGenerating) return;
            isGenerating = true;
            if (animId) cancelAnimationFrame(animId); 

            const theme = document.querySelector('input[name="gifTheme"]:checked').value;
            const bgMode = document.querySelector('input[name="gifBg"]:checked').value;
            const btn = document.getElementById('downloadGifBtn');
            const progress = document.getElementById('progressText');
            
            btn.disabled = true;
            btn.className = "w-full py-4 bg-slate-400 text-white rounded-lg font-bold text-xl cursor-wait flex items-center justify-center gap-2";
            btn.innerHTML = `處理中...`;

            let workerBlobUrl;
            try {
                const workerResponse = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
                const workerBlob = await workerResponse.blob();
                workerBlobUrl = URL.createObjectURL(workerBlob);
            } catch (e) { console.warn("Worker loading fallback"); }

            // 產生暫存圖以取得正確尺寸
            const tempCanvas = document.createElement('canvas');
            if (gifConfig.target === 'banner') renderLogoFrame(tempCanvas, theme, 0, null, false, 'Flux', 'SECS');
            else renderIconFrame(tempCanvas, theme, 0, null);

            const gif = new GIF({
                workers: 2, quality: 1,
                width: tempCanvas.width, height: tempCanvas.height,
                workerScript: workerBlobUrl, 
                transparent: bgMode === 'transparent' ? 0x000000 : null 
            });

            const fps = 30; const duration = 2; const totalFrames = fps * duration;
            const gifBgColor = bgMode === 'transparent' ? null : (theme === 'light' ? '#ffffff' : '#090a0f');
            
            // 重要修正：必須明確設定 frameCanvas 的尺寸，否則會預設為 300x150，導致圖檔變形和產生不明線條
            const frameCanvas = document.createElement('canvas');
            frameCanvas.width = tempCanvas.width;
            frameCanvas.height = tempCanvas.height;

            for (let i = 0; i < totalFrames; i++) {
                const t = i / totalFrames;
                const intensity = (Math.sin(t * Math.PI * 2 - Math.PI/2) + 1) / 2;

                if (gifConfig.target === 'banner') {
                    renderLogoFrame(frameCanvas, theme, intensity, gifBgColor, false, 'Flux', 'SECS');
                } else {
                    renderIconFrame(frameCanvas, theme, intensity, gifBgColor);
                }
                
                gif.addFrame(frameCanvas, {copy: true, delay: 1000 / fps});
                
                if(i % 5 === 0) {
                    progress.textContent = `繪製影格: ${Math.round((i/totalFrames)*100)}%`;
                    await new Promise(r => setTimeout(r, 0));
                }
            }

            progress.textContent = "編碼 GIF 中... (請稍候)";

            gif.on('finished', function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const namePrefix = gifConfig.target === 'banner' ? getBrandName() : 'App_Icon';
                const nameTheme = theme === 'light' ? 'Solar' : 'Aurora';
                const nameBg = bgMode === 'transparent' ? '_Transparent' : '';
                a.download = `${namePrefix}_${nameTheme}${nameBg}.gif`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                isGenerating = false;
                btn.disabled = false;
                btn.className = "w-full py-4 bg-gradient-to-r from-green-600 to-teal-500 hover:from-green-700 hover:to-teal-600 text-white rounded-lg font-bold text-xl shadow-lg transition flex items-center justify-center gap-2";
                btn.innerHTML = `<span>下載 GIF 檔案</span>`;
                progress.textContent = "下載已開始";
                startPreview();
            });

            gif.render();
        }

        // ================= 4. 輔助與靜態匯出函式 =================

                function downloadLink(url, filename) { const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); }

        /**
         * 下載 PNG（未去背：保持原本卡片背景/星點/邊框）
         */
        function downloadPNG(canvasId, filename) {
            const s = document.getElementById(canvasId);
            if (!s) { alert("PNG 下載失敗：找不到 Canvas。"); return; }
            s.toBlob((blob) => {
                if (!blob) { alert("PNG 下載失敗：無法建立 Blob。"); return; }
                const url = URL.createObjectURL(blob);
                downloadLink(url, filename);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            }, "image/png");
        }

        /**

            c.toBlob((blob) => {
                if (!blob) {
                    alert("PNG 產生失敗：無法建立 Blob。");
                    return;
                }
                const url = URL.createObjectURL(blob);
                downloadLink(url, filename);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            }, "image/png");
        }

        async function copyToClipboard(text) {
            // Clipboard API 在 file:// 或非安全來源可能不可用，因此提供 fallback。
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) { /* ignore and fallback */ }

            try {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.setAttribute("readonly", "");
                ta.style.position = "fixed";
                ta.style.top = "-1000px";
                ta.style.left = "-1000px";
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand("copy");
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

            const bin = atob(b64);
            const buf = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
            _opentypeFont = opentype.parse(buf.buffer);
            return _opentypeFont;
        }

        async function downloadSVGPath(canvasId, filename) {
            const statusEl = document.getElementById('status');
            const origText = statusEl ? statusEl.textContent : '';
            if (statusEl) { statusEl.textContent = '正在載入字型並轉換路徑...'; statusEl.className = statusEl.className.replace('green','yellow'); }

            try {
                const font = await loadOpentypeFont();
                const map = {
                    c1: { type: 'banner', theme: 'light' },
                    c2: { type: 'banner', theme: 'dark'  },
                    c3: { type: 'icon',   theme: 'light' },
                    c4: { type: 'icon',   theme: 'dark'  }
                };
                const cfg = map[canvasId];
                if (!cfg) { alert('找不到對應圖檔類型'); return; }

                let svgText;
                if (cfg.type === 'banner') {
                    svgText = buildBannerSVGPath(font, cfg.theme);
                } else {
                    svgText = buildIconSVGPath(font, cfg.theme);
                }

                const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                downloadLink(url, filename);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast('SVG(路徑版) 已下載 — 完全不依賴字型');
            } catch(e) {
                console.error(e);
                alert('字型載入失敗：' + e.message + '\n\n請確認網路連線，或改用「複製SVG」後手動轉路徑。');
            } finally {
                if (statusEl) { statusEl.textContent = origText || '就緒'; }
            }
        }

        function textToPathData(font, text, fontSize, x, y) {
            // opentype.js: getPath returns a Path object with .toPathData(decimals)
            const path = font.getPath(text, x, y, fontSize);
            return path.toPathData(2);
        }

        function buildBannerSVGPath(font, theme) {
            // Measure with opentype to get exact width (consistent with Canvas measurement)
            const scale = fontSize / font.unitsPerEm;
            function measureText(txt) {
                let w = 0;
                for (const ch of txt) {
                    const g = font.charToGlyph(ch);
                    w += (g.advanceWidth || 0) * scale;
                }
                return w;
            }

            const wFlux = measureText(brandLeft);
            const wSecs = measureText(brandRight);
            const gap = 0;
            const totalTextW = wFlux + gap + wSecs;
            const contentW = totalTextW + (paddingX * 2);
            const contentH = (fontSize * 0.8) + (paddingY * 2);
            const lw = theme === 'light' ? 4 : 2;
            const finalW = Math.ceil(contentW + lw);
            const finalH = Math.ceil(contentH + lw);
            const rectX = lw / 2;
            const rectY = lw / 2;
            const cardW = contentW;
            const cardH = contentH;
            const r = 32;

            // Text baseline: opentype uses baseline (not middle), so compute Y
            // Canvas uses textBaseline='middle', textY = rectY + cardH/2 + 5
            // opentype baseline Y = that same textY (since dominant-baseline=middle means center of em box)
            // Actually opentype y is the baseline. We need to offset by ascender to approximate middle.
            const ascender = font.ascender * scale;
            const descender = Math.abs(font.descender * scale);
            const emHeight = ascender + descender;
            const textMidY = rectY + cardH / 2 + 5;
            // baseline = midY + (ascender - emHeight/2)
            const baselineY = textMidY + (ascender - emHeight / 2);

            const startX = rectX + paddingX;
            const secsX = startX + wFlux + gap;

            const fluxPathD = textToPathData(font, brandLeft,  fontSize, startX, baselineY);
            const secsPathD = textToPathData(font, brandRight, fontSize, secsX,  baselineY);

            const border = theme === 'light' ? '#e2e8f0' : 'rgba(255,255,255,0.15)';
            const bg     = theme === 'light' ? 'url(#bgSolid)' : 'url(#bgGrad)';

            let stars = '';
            if (theme === 'dark') {
                let seed = 1;
                const rand = () => { const x = Math.sin(seed++) * 10000; return x - Math.floor(x); };
                for (let i = 0; i < 30; i++) {
                    const cx = (rectX + rand() * cardW).toFixed(2);
                    const cy = (rectY + rand() * cardH).toFixed(2);
                    const rr = (rand() * 2.5).toFixed(2);
                    const a  = (rand() * 0.8).toFixed(3);
                    stars += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="rgba(255,255,255,${a})"/>`;
                }
            }

            // SECS: stroke outline (light) + fill
            const secsStroke = theme === 'light'
                ? `<path d="${secsPathD}" fill="none" stroke="rgba(6,182,212,1)" stroke-width="24" stroke-linejoin="round"/>`
                : '';
            const secsFill = theme === 'light'
                ? `<path d="${secsPathD}" fill="url(#secsGrad)"/>`
                : `<path d="${secsPathD}" fill="white" filter="url(#neonGlow)"/>
  <path d="${secsPathD}" fill="white"/>`;

            return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${finalW}" height="${finalH}" viewBox="0 0 ${finalW} ${finalH}">
  <defs>
    <linearGradient id="fluxGrad" x1="0" y1="${rectY}" x2="0" y2="${rectY + cardH}">
      <stop offset="0" stop-color="${colors.fluxStart}"/>
      <stop offset="1" stop-color="${colors.fluxEnd}"/>
    </linearGradient>
    <linearGradient id="secsGrad" x1="0" y1="${rectY}" x2="0" y2="${rectY + cardH}">
      <stop offset="0" stop-color="${colors.secsDeep[0]}"/>
      <stop offset="0.5" stop-color="${colors.secsDeep[1]}"/>
      <stop offset="1" stop-color="${colors.secsDeep[2]}"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="${rectX + cardW/2}" cy="${rectY + cardH}" r="${cardW}" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2735"/>
      <stop offset="1" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="bgSolid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="${rectX}" y="${rectY}" width="${cardW}" height="${cardH}" rx="${r}" ry="${r}"/>
    </clipPath>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="${colors.neonCyan}" flood-opacity="1"/>
    </filter>
  </defs>
  <rect x="${rectX}" y="${rectY}" width="${cardW}" height="${cardH}" rx="${r}" ry="${r}" fill="${bg}"/>
  <g clip-path="url(#cardClip)">
    ${stars}
    <path d="${fluxPathD}" fill="url(#fluxGrad)"/>
    ${secsStroke}
    ${secsFill}
  </g>
  <rect x="${rectX}" y="${rectY}" width="${cardW}" height="${cardH}" rx="${r}" ry="${r}" fill="none" stroke="${border}" stroke-width="${lw}"/>
</svg>`;
        }

        function buildIconSVGPath(font, theme) {
            const w = 512, h = 512;
            const lw = 8;
            const margin = lw / 2;
            const cardW = w - lw;
            const cardH = h - lw;
            const r = 110;

            const iconFontSize = 300;
            const scale = iconFontSize / font.unitsPerEm;
            const ascender  = font.ascender  * scale;
            const descender = Math.abs(font.descender * scale);
            const emHeight  = ascender + descender;
            const centerY   = 274;
            const baselineY = centerY + (ascender - emHeight / 2);

            function measureChar(ch) {
                return (font.charToGlyph(ch).advanceWidth || 0) * scale;
            }

            const leftChar  = getIconLeftLetter();
            const rightChar = getIconRightLetter();
            const wLeft  = measureChar(leftChar);
            const wRight = measureChar(rightChar);

            const leftX  = 168 - wLeft  / 2;
            const rightX = 354 - wRight / 2;

            const leftPathD  = textToPathData(font, leftChar,  iconFontSize, leftX,  baselineY);
            const rightPathD = textToPathData(font, rightChar, iconFontSize, rightX, baselineY);

            const border = theme === 'light' ? '#e2e8f0' : 'rgba(255,255,255,0.1)';
            const bg     = theme === 'light' ? 'url(#bgSolidIcon)' : 'url(#bgGradIcon)';

            const rightStroke = theme === 'light'
                ? `<path d="${rightPathD}" fill="none" stroke="rgba(6,182,212,1)" stroke-width="32" stroke-linejoin="round"/>`
                : '';
            const rightFill = theme === 'light'
                ? `<path d="${rightPathD}" fill="url(#secsGradIcon)"/>`
                : `<path d="${rightPathD}" fill="white" filter="url(#neonGlowIcon)"/>
  <path d="${rightPathD}" fill="white"/>`;

            return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <defs>
    <linearGradient id="fluxGradIcon" x1="0" y1="${margin}" x2="0" y2="${margin + cardH}">
      <stop offset="0" stop-color="${colors.fluxStart}"/>
      <stop offset="1" stop-color="${colors.fluxEnd}"/>
    </linearGradient>
    <linearGradient id="secsGradIcon" x1="0" y1="${margin}" x2="0" y2="${margin + cardH}">
      <stop offset="0" stop-color="${colors.secsDeep[0]}"/>
      <stop offset="1" stop-color="${colors.secsDeep[2]}"/>
    </linearGradient>
    <radialGradient id="bgGradIcon" cx="256" cy="256" r="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2735"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="bgSolidIcon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="neonGlowIcon" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="${colors.neonCyan}" flood-opacity="1"/>
    </filter>
  </defs>
  <rect x="${margin}" y="${margin}" width="${cardW}" height="${cardH}" rx="${r}" ry="${r}" fill="${bg}"/>
  <path d="${leftPathD}" fill="url(#fluxGradIcon)"/>
  ${rightStroke}
  ${rightFill}
  <rect x="${margin}" y="${margin}" width="${cardW}" height="${cardH}" rx="${r}" ry="${r}" fill="none" stroke="${border}" stroke-width="${lw}"/>
</svg>`;
        }

    </script>
</body>

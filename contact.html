						<main class="page-scroll">
							<section class="centered-hero compact-page-hero">
								<div class="container">
									<h1>聯絡我們</h1>
									<p>有任何產品、授權或技術問題，歡迎留言，我們會盡快回覆您。</p>
								</div>
							</section>
							<section class="section compact-section">
								<div class="container">
									<form class="card contact-form" id="contactForm" novalidate>
										<div class="contact-row">
											<label class="contact-field">
												<span>姓名 <em>*</em></span>
												<input type="text" name="姓名" required autocomplete="name" maxlength="100">
											</label>
											<label class="contact-field">
												<span>Email <em>*</em></span>
												<input type="email" name="email" required autocomplete="email" maxlength="200">
											</label>
										</div>
										<label class="contact-field">
											<span>公司名稱</span>
											<input type="text" name="公司" autocomplete="organization" maxlength="200">
										</label>
										<label class="contact-field">
											<span>主旨 <em>*</em></span>
											<input type="text" name="主旨" required maxlength="200">
										</label>
										<label class="contact-field">
											<span>內容 <em>*</em></span>
											<textarea name="內容" rows="6" required maxlength="5000"></textarea>
										</label>
										<!-- 防機器人：真人看不到這個欄位 -->
										<input type="text" name="_honey" class="contact-honey" tabindex="-1" autocomplete="off">
										<div class="contact-actions">
											<button class="btn btn-primary" type="submit" id="contactSubmit">送出</button>
											<p class="contact-status" id="contactStatus" role="status" aria-live="polite"></p>
										</div>
									</form>
								</div>
							</section>
